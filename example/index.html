<!DOCTYPE html>
<html lang="zh-CN" data-design="linear" data-scheme="dark" data-icon-style="outline" data-font="inter">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMG-WebUI · Design Themes</title>
    <!-- FOUC: sync localStorage → data-* before CSS/app paint -->
    <script>
      (function () {
        try {
          var d = document.documentElement
          var ns = 'amg-webui'
          var g = function (s) {
            try {
              return localStorage.getItem(ns + '-' + s)
            } catch (e) {
              return null
            }
          }
          var design = g('design-v3') || g('design-v2') || g('theme')
          var legacy = {
            default: 'linear',
            admin: 'linear',
            tech: 'linear',
            corporate: 'mercedes',
            borderless: 'mercedes',
            ecommerce: 'apple',
            government: 'mercedes',
            business: 'mercedes',
            screen: 'porsche'
          }
          if (design && legacy[design]) design = legacy[design]
          var ok = { mercedes: 1, linear: 1, porsche: 1, lamborghini: 1, ferrari: 1, apple: 1 }
          if (design && ok[design]) d.setAttribute('data-design', design)
          var scheme = g('scheme')
          if (scheme === 'dark' || scheme === 'light') {
            var cur = d.getAttribute('data-design') || 'linear'
            if (cur === 'linear' || cur === 'apple') d.setAttribute('data-scheme', scheme)
          }
          var font = g('font-v3')
          var fonts = {
            inter: 1,
            barlow: 1,
            anton: 1,
            archivo: 1,
            'albert-sans': 1,
            yahei: 1,
            song: 1,
            heiti: 1,
            apple: 1
          }
          if (font && fonts[font]) d.setAttribute('data-font', font)
          var icon = g('icon-style-v2')
          if (icon === 'outline' || icon === 'solid') {
            d.setAttribute('data-icon-style', icon)
            d.style.setProperty('--icon-stroke-width', icon === 'solid' ? '2.25' : '1.75')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Anton&family=Archivo:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
