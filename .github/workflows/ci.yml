name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck · catalog · i18n · test · build · consumers)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx vue-tsc --noEmit

      - name: Package boundaries
        run: npm run check:boundaries

      - name: Validate component catalog
        run: npm run validate:catalog

      - name: Verify component barrels are in sync
        run: |
          npm run generate:entry
          if ! git diff --quiet -- packages/components/**/index.ts; then
            echo "::error::Component barrel index.ts files are out of sync. Run npm run generate:entry and commit."
            git diff -- packages/components/**/index.ts
            exit 1
          fi

      - name: i18n key sync (extract + schema drift)
        run: |
          npm run extract:i18n
          if ! git diff --quiet -- packages/locale/message-schema.ts; then
            echo "::error::packages/locale/message-schema.ts drifted. Run npm run extract:i18n and commit."
            git diff -- packages/locale/message-schema.ts
            exit 1
          fi

      - name: Route titleKey contract
        run: npm run check:route-title-keys

      - name: Unit tests
        run: npm run test

      - name: SSR import / theme-core smoke
        run: npm run test:ssr

      - name: Build library
        run: npm run build:lib

      - name: Dist artifacts (ondemand · brand CSS · size budgets)
        run: npm run check:dist

      - name: Consumer fixtures (vite · webpack · nuxt)
        run: npm run test:consumers

      - name: Component hardening gates
        run: |
          npm run hardening:generate
          npm run hardening:demote
          npm run verify:component -- --all --strict
          npm run check:evidence-freshness
          npm run hardening:demote
          npm run hardening:dashboard
          npm run check:version-consistency
          npm run check:docs-drift
          npm run check:closed-components
          npm run test:showcases
          node -e "const d=require('./component-hardening/dashboard/component-dashboard.json'); const fake=d.components.filter(c=>c.productMaturity==='stable'&&!c.verifiedStable); if(fake.length){console.error('Fake stable rows', fake.length, fake.slice(0,10).map(c=>c.name)); process.exit(1)} console.log('verifiedStable=', d.stableRatio+'%', 'gatePass=', d.gates?.pass+'/'+d.gates?.total, 'claimedUnverified=', d.honesty?.claimedStableUnverified)"

      - name: Build docs
        run: npm run docs:build

  browser-verify:
    name: Browser verify (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build example shell
        run: npm run build:example

      - name: Lowcode golden path
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/lowcode-golden-path.spec.ts --project=chromium

      - name: Browser A11Y + theme contrast
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/a11y-core-contrast.spec.ts --project=chromium

  hardening-changed:
    name: Changed component gates (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect changed components
        id: changed
        run: |
          npm run hardening:generate
          node scripts/hardening/changed-components.mjs origin/${{ github.base_ref }}
          comps=$(node -e "const j=require('./component-hardening/reports/changed-components.json'); process.stdout.write((j.components||[]).join(' '))")
          echo "components=$comps" >> "$GITHUB_OUTPUT"

      - name: Verify changed components
        if: steps.changed.outputs.components != ''
        run: |
          for c in ${{ steps.changed.outputs.components }}; do
            npm run verify:component -- "$c"
          done

  nightly-hardening:
    name: Nightly visual / browser / benchmark matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run hardening:generate
      - run: npm run verify:component -- --all --strict
      - run: npm run check:evidence-freshness
      - run: npm run hardening:ssr
      - run: npm run hardening:visual
      - run: npm run hardening:dashboard
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:example
      - run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      - uses: actions/upload-artifact@v4
        with:
          name: hardening-dashboard
          path: component-hardening/dashboard/

  e2e:
    name: E2E (Playwright · Chromium/Firefox/WebKit/Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build example shell
        run: npm run build:example

      - name: Run Playwright matrix
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
