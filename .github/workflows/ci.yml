name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck · catalog · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx vue-tsc --noEmit

      - name: Validate component catalog
        run: npm run validate:catalog

      - name: Verify component barrels are in sync
        run: |
          npm run generate:entry
          if ! git diff --quiet -- packages/components/**/index.ts; then
            echo "::error::Component barrel index.ts files are out of sync. Run npm run generate:entry and commit."
            git diff -- packages/components/**/index.ts
            exit 1
          fi

      - name: Unit tests
        run: npm run test

      - name: Build library
        run: npm run build:lib

      - name: Build docs
        run: npm run docs:build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build example shell
        run: npm run build:example

      - name: Run Playwright smoke tests
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e
