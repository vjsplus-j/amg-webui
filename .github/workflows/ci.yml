name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck · catalog · i18n · test · build · consumers)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx vue-tsc --noEmit

      - name: Package boundaries
        run: npm run check:boundaries

      - name: Validate component catalog
        run: npm run validate:catalog

      - name: Verify component barrels are in sync
        run: |
          npm run generate:entry
          if ! git diff --quiet -- packages/components/**/index.ts; then
            echo "::error::Component barrel index.ts files are out of sync. Run npm run generate:entry and commit."
            git diff -- packages/components/**/index.ts
            exit 1
          fi

      - name: i18n key sync (extract + schema drift)
        run: |
          npm run extract:i18n
          if ! git diff --quiet -- packages/locale/message-schema.ts; then
            echo "::error::packages/locale/message-schema.ts drifted. Run npm run extract:i18n and commit."
            git diff -- packages/locale/message-schema.ts
            exit 1
          fi

      - name: Route titleKey contract
        run: npm run check:route-title-keys

      - name: Unit tests
        run: npm run test

      - name: SSR import / theme-core smoke
        run: npm run test:ssr

      - name: Build library
        run: npm run build:lib

      - name: Dist artifacts (ondemand · brand CSS · size budgets)
        run: npm run check:dist

      - name: Consumer fixtures (vite · webpack · nuxt)
        run: npm run test:consumers

      - name: Build docs
        run: npm run docs:build

  e2e:
    name: E2E (Playwright · Chromium/Firefox/WebKit/Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build example shell
        run: npm run build:example

      - name: Run Playwright matrix
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
